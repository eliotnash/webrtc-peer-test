services:
  webrtc-test-prod:
    build: ./signaling
    image: webrtc-peer-test:prod
    container_name: webrtc-test-prod
    restart: unless-stopped
    ports:
      - "443:10443"
    environment:
      PORT: "10443"
      TLS_CERT: /app/certs/server.crt
      TLS_KEY: /app/certs/server.key
    volumes:
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:10443,path:'/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

