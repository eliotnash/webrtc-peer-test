<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebRTC Peer Test</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">WEBRTC DIAGNOSTICS</p><h1 data-i18n="title">端到端连接测试</h1><p data-i18n="subtitle">数据消息、摄像头与屏幕共享</p></div>
    <div class="header-actions"><button id="languageBtn">English</button><span id="secureBadge" class="badge" data-i18n="secure">安全连接</span></div>
  </header>
  <section class="card join">
    <input id="roomInput" maxlength="24" data-i18n-placeholder="roomPlaceholder" placeholder="输入房间号（留空则自动生成）">
    <button id="createBtn" data-i18n="createRoom">创建房间</button>
    <button id="joinBtn" class="primary" data-i18n="joinRoom">进入房间</button>
  </section>
  <section class="status-grid">
    <div class="card metric"><span data-i18n="signaling">信令</span><strong id="signalStatus" data-status-key="disconnected">未连接</strong></div>
    <div class="card metric"><span data-i18n="remoteDevice">远端设备</span><strong id="peerStatus" data-status-key="waiting">等待加入</strong></div>
    <div class="card metric"><span>WebRTC</span><strong id="rtcStatus" data-status-key="notEstablished">未建立</strong></div>
    <div class="card metric"><span data-i18n="route">连接路径</span><strong id="routeStatus" data-status-key="pending">待检测</strong></div>
  </section>
  <section class="card panel">
    <h2 data-i18n="candidatesTitle">ICE 候选地址</h2>
    <div class="layout">
      <div><h3 data-i18n="localCandidates">本地候选</h3><pre id="localCandidates">尚未发现</pre></div>
      <div><h3 data-i18n="remoteCandidates">远端候选</h3><pre id="remoteCandidates">尚未发现</pre></div>
    </div>
    <h3 data-i18n="selectedCandidatePair">最终选择的候选对</h3>
    <pre id="selectedPair">尚未选择</pre>
  </section>
  <section class="layout">
    <div class="card panel">
      <h2 data-i18n="mediaChannel">媒体通道</h2>
      <div class="videos"><div><label data-i18n="local">本地</label><video id="localVideo" autoplay muted playsinline></video></div><div><label data-i18n="remote">远端</label><video id="remoteVideo" autoplay playsinline></video></div></div>
      <div class="actions"><button id="cameraBtn" data-i18n="shareCamera">共享摄像头</button><button id="screenBtn" data-i18n="shareScreen">共享屏幕</button><button id="stopMediaBtn" data-i18n="stopSharing">停止共享</button></div>
    </div>
    <div class="card panel chat"><h2 data-i18n="dataChannel">数据通道</h2><div id="messages" class="messages"></div><div class="send"><input id="messageInput" data-i18n-placeholder="messagePlaceholder" placeholder="输入测试消息"><button id="sendBtn" class="primary" data-i18n="send">发送</button></div></div>
  </section>
  <section class="card panel"><div class="log-title"><h2 data-i18n="connectionLog">连接过程日志</h2><button id="clearLogBtn" data-i18n="clear">清空</button></div><pre id="log"></pre></section>
  <section class="card panel downloads">
    <h2 data-i18n="cliTitle">命令行客户端</h2>
    <p data-i18n="cliDescription">下载对应系统版本，使用房间号加入测试。自签名证书需要增加 --insecure。</p>
    <div class="download-links"><a href="/download/webrtc-test-windows-amd64.exe">Windows</a><a href="/download/webrtc-test-linux-amd64">Linux x64</a><a href="/download/webrtc-test-linux-arm64">Linux ARM64</a><a href="/download/webrtc-test-macos-amd64">macOS Intel</a><a href="/download/webrtc-test-macos-arm64">macOS Apple Silicon</a><a href="/server.crt" data-i18n="downloadCert">下载证书</a></div>
    <code id="cliCreateCommand" class="command"></code>
    <code id="cliJoinCommand" class="command"></code>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
